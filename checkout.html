<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - HomeMadeGifts</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/premium.css">
  <link rel="stylesheet" href="styles/glow.css">
  <style>
    body {
      padding-top: 0;
      background-image: radial-gradient(circle at top left, rgba(212, 175, 55, 0.1), transparent 40%),
        radial-gradient(circle at bottom right, rgba(194, 24, 91, 0.05), transparent 40%);
      background-attachment: fixed;
      overflow-y: auto;
      /* Ensure vertical scrolling */
      min-height: 100vh;
    }

    html {
      overflow-y: auto !important;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 40px;
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--secondary);
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .checkout-card {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .checkout-card h3 {
      font-family: var(--font-heading);
      color: var(--secondary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 15px;
      margin-bottom: 25px;
      font-size: 1.5rem;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
      font-size: 0.95rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      font-family: var(--font-body);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .btn-location {
      background: #e0f7fa;
      color: #006064;
      border: 1px solid #b2ebf2;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 5px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-location:hover {
      background: #b2ebf2;
    }

    /* Summary Styles */
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      color: #555;
    }

    .summary-row strong {
      color: var(--secondary);
    }

    .summary-total {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      padding-top: 20px;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-hover);
    }

    .offer-box {
      margin-bottom: 25px;
      padding: 15px;
      background: #fff8e1;
      border: 1px solid #ffecb3;
      border-radius: 10px;
      color: #795548;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .payment-option {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .payment-option:hover {
      background: white;
      border-color: var(--primary);
    }

    .payment-option input {
      width: auto;
      margin: 0;
    }

    .btn-place-order {
      width: 100%;
      margin-top: 30px;
      font-size: 1.1rem;
      padding: 15px;
      letter-spacing: 1px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .checkout-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .checkout-card {
        padding: 20px;
      }

      h2 {
        font-size: 1.8rem;
        margin-bottom: 25px;
      }
    }

    @media (max-width: 480px) {
      .summary-total {
        font-size: 1.2rem;
      }

      .checkout-card h3 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <!-- Header injected by universal-header.js -->

  <main class="container">
    <h2 class="animate-fade">Complete Your Order</h2>

    <form id="order-form" class="checkout-grid animate-fade">

      <!-- Left Column: Shipping Details -->
      <section class="checkout-card">
        <h3>1. Shipping Information</h3>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="+91 98765 43210" pattern="[0-9]{10}"
            title="Please enter a valid 10-digit number" />
        </div>

        <div class="form-group">
          <label for="address">Shipping Address</label>
          <textarea id="address" rows="3" required
            placeholder="Flat No., Street, Area, Pincode, City, State"></textarea>
        </div>

        <div class="form-group">
          <label for="live-location">Live Location (Optional)</label>
          <button type="button" id="get-location-btn" class="btn-location">
            <span>📍</span> Get My Current Location
          </button>
          <input type="text" id="live-location" placeholder="Latitude, Longitude" readonly
            style="margin-top: 10px; background-color: #f9f9f9;" />
        </div>

        <!-- NEW: Gift Message Section -->
        <div class="form-group" style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
          <label style="display: flex; align-items: center; cursor: pointer; color: var(--primary-hover);">
            <input type="checkbox" id="is-gift" style="width: auto; margin-right: 10px;">
            🎁 Is this a gift?
          </label>
          <div id="gift-message-container" style="display: none; margin-top: 15px; animation: fadeIn 0.3s ease;">
            <label for="gift-message">Your Personal Message</label>
            <textarea id="gift-message" rows="3" placeholder="Write a sweet note for the recipient..."></textarea>
          </div>
        </div>
      </section>

      <!-- Right Column: Summary & Payment -->
      <section class="checkout-card">
        <h3>2. Order Summary</h3>

        <div id="user-offer" class="offer-box" style="display: none;">
          <!-- Offer text injected by JS -->
        </div>

        <div class="order-totals">
          <div class="summary-row">
            <span>Items Subtotal</span>
            <strong id="subtotal-checkout">₹0.00</strong>
          </div>
          <div class="summary-row">
            <span>Discount Applied</span>
            <strong style="color: #388e3c;">-<span id="discount-checkout">₹0.00</span></strong>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <strong>Free</strong>
          </div>

          <div class="summary-total">
            <span>Total</span>
            <span id="total-checkout">₹0.00</span>
          </div>
        </div>

        <h3 style="margin-top: 30px; font-size: 1.3rem;">3. Payment Method</h3>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="payment-mode" value="COD" checked />
            <span>Cash on Delivery (COD)</span>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-place-order">
          Place Order & Send Email
        </button>

        <p style="text-align: center; margin-top: 15px; font-size: 0.85rem; color: #666;">
          By placing this order, you agree to our Terms of Service.
        </p>
      </section>
    </form>
  </main>

  <footer class="main-footer">
    <p>© 2025 HomeMadeGifts.</p>
  </footer>

  <!-- Scripts -->
  <script src="scripts/cart-manager.js"></script>
  <script src="scripts/universal-header.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Check Login & Cart Status
      const userLoggedIn = localStorage.getItem("user_logged_in") === "true";

      // Helper to get user safely
      const getUserSafe = () => {
        try {
          return JSON.parse(localStorage.getItem("user_data"));
        } catch (e) { return null; }
      };

      const user = getUserSafe();
      const cart = CartManager.getCart();

      if (!userLoggedIn || !user) {
        alert("Please log in to continue.");
        window.location.href = "login.html";
        return;
      }

      if (cart.length === 0) {
        alert("Your cart is empty!");
        window.location.href = "cart.html";
        return;
      }

      // 2. Pre-fill Content
      if (user) {
        // Pre-fill phone/email if possible, but user object structure varies so we leave blank or try to fill
        // document.getElementById('name').value = user.name || ''; // if available
      }

      // 3. Location Logic
      document.getElementById("get-location-btn").addEventListener("click", () => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              document.getElementById("live-location").value = `${latitude}, ${longitude}`;
              // alert("Location fetched!"); // Removed consistent alert for better UX
            },
            (error) => {
              alert("⚠️ Unable to get location: " + error.message);
            }
          );
        } else {
          alert("Geolocation not supported by your browser.");
        }
      });

      // 3.5 Gift Message Toggle
      const giftCheckbox = document.getElementById('is-gift');
      const giftContainer = document.getElementById('gift-message-container');

      giftCheckbox.addEventListener('change', (e) => {
        giftContainer.style.display = e.target.checked ? 'block' : 'none';
      });

      // 4. Calculate Totals Logic (Robust)
      let subtotal = 0;
      let total = 0; // The actual price to pay
      let discount = 0;

      cart.forEach((i) => {
        // Ensure numbers
        const currentPrice = parseFloat(i.currentPrice) || 0;
        const originalPrice = i.originalPrice ? parseFloat(i.originalPrice) : currentPrice;
        const quantity = parseInt(i.quantity) || 1;

        // Subtotal is based on ORIGINAL price (the market price)
        subtotal += originalPrice * quantity;

        // Total is based on CURRENT (discounted) price
        total += currentPrice * quantity;
      });

      // Calculate initial discount
      discount = subtotal - total;

      // 5. Apply User Offers
      const offerBox = document.getElementById("user-offer");
      let finalTotal = total;

      // Check both stored boolean and string "true"
      if (user.isNewUser === true || user.isNewUser === "true" || localStorage.getItem('isNewUser') === 'true') {
        const extraDiscount = total * 0.10; // 10% extra
        finalTotal -= extraDiscount;
        discount += extraDiscount;

        offerBox.innerHTML = "✨ <strong>First-Time Offer:</strong> Extra 10% Discount Applied!";
        offerBox.style.display = "flex";
      } else {
        offerBox.innerHTML = "🎁 <strong>Welcome back!</strong> We hope you enjoy your shopping.";
        offerBox.style.display = "flex";
      }

      // 6. Update UI
      document.getElementById("subtotal-checkout").textContent = `₹${subtotal.toFixed(2)}`;
      document.getElementById("discount-checkout").textContent = `₹${discount.toFixed(2)}`;
      document.getElementById("total-checkout").textContent = `₹${finalTotal.toFixed(2)}`;

      // 7. Handle Order Submission
      document.getElementById("order-form").addEventListener("submit", (e) => {
        e.preventDefault();

        // Get values
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const address = document.getElementById("address").value.trim();
        const location = document.getElementById("live-location").value.trim();
        const paymentMode = document.querySelector('input[name="payment-mode"]:checked').value;

        // Gift Message Data
        const isGift = document.getElementById('is-gift').checked;
        const giftMessage = isGift ? document.getElementById('gift-message').value.trim() : '';

        const ADMIN_EMAIL = "littlehoopsandhampers@gmail.com";

        // Format Items for Email
        const itemsList = cart
          .map((i) => `• ${i.name} x ${i.quantity} (₹${i.currentPrice})`)
          .join("\n");

        let emailBody = `NEW ORDER RECEIVED!
--------------------------------
Customer: ${user.email}
Name: ${name}
Phone: ${phone}
--------------------------------
ITEMS:
${itemsList}
--------------------------------
`;

        if (isGift && giftMessage) {
          emailBody += `🎁 GIFT MESSAGE:
"${giftMessage}"
--------------------------------
`;
        }

        emailBody += `Billing Details:
Subtotal: ₹${subtotal.toFixed(2)}
Discount: -₹${discount.toFixed(2)}
TOTAL TO PAY: ₹${finalTotal.toFixed(2)}
Payment Mode: ${paymentMode}
--------------------------------
Shipping Address:
${address}
Location: ${location || "Not Shared"}
`;

        const subject = encodeURIComponent(`New Order from ${name} - ₹${finalTotal.toFixed(2)}`);
        const body = encodeURIComponent(emailBody);

        // Open Email Client
        window.open(`mailto:${ADMIN_EMAIL}?subject=${subject}&body=${body}`, "_blank");

        // Save Order to LocalStorage
        const orders = JSON.parse(localStorage.getItem("homemade_orders")) || [];
        orders.push({
          id: Date.now(),
          user_email: user.email || user.id, // Fallback if email missing
          totalAmount: finalTotal.toFixed(2),
          paymentMode,
          date: new Date().toLocaleString(),
          shipping: { name, phone, address, location },
          items: cart,
          gift: { isGift, message: giftMessage }, // Save gift data
          status: 'Pending'
        });

        localStorage.setItem("homemade_orders", JSON.stringify(orders));

        // Clear Cart
        CartManager.clearCart();

        // Redirect
        alert("✅ Order placed successfully! You can track it in your Dashboard.");
        window.location.href = "dashboard.html";
      });
    });
  </script>
  <script src="scripts/glow-reveal.js"></script>
</body>

</html>
