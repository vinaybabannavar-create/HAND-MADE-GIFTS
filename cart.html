<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Shopping Cart - HomeMadeGifts</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/premium.css">
  <link rel="stylesheet" href="styles/glow.css">

  <style>
    /* Page Specific Overrides for Cart */
    body {
      padding-top: 0;
      /* Header is sticky/fixed */
      background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent 40%),
        radial-gradient(circle at bottom left, rgba(194, 24, 91, 0.05), transparent 40%);
      background-attachment: fixed;
    }

    .cart-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5rem;
      color: var(--secondary);
      position: relative;
    }

    .page-title::after {
      content: '';
      display: block;
      width: 100px;
      height: 3px;
      background: var(--primary);
      margin: 15px auto 0;
      border-radius: 2px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
      align-items: start;
    }

    /* Cart Items Section */
    .cart-items-section {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      padding-bottom: 20px;
      margin-bottom: 20px;
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--secondary);
    }

    .cart-item {
      display: flex;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .cart-item:hover {
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding-left: 10px;
      padding-right: 10px;
      margin-left: -10px;
      margin-right: -10px;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      object-fit: cover;
      margin-right: 25px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .item-details {
      flex-grow: 1;
    }

    .item-details h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--secondary);
    }

    .item-meta {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 5px;
    }

    .item-price {
      color: var(--primary-hover);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      padding: 5px;
    }

    .item-actions input {
      width: 40px;
      text-align: center;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      outline: none;
    }

    /* Remove Spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ff4d4d;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .btn-remove:hover {
      color: #d32f2f;
      text-decoration: underline;
    }

    /* Summary Section */
    .cart-summary-card {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 100px;
    }

    .cart-summary-card h3 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      display: inline-block;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #555;
      font-size: 1rem;
    }

    .summary-row.total {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      padding-top: 20px;
      margin-top: 20px;
      font-weight: 700;
      color: var(--secondary);
      font-size: 1.3rem;
    }

    .btn-checkout {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .empty-cart-message {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-cart-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
      color: var(--primary);
    }

    .empty-cart-message p {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 30px;
    }

    @media (max-width: 900px) {
      .cart-layout {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .cart-summary-card {
        position: static;
        margin-top: 20px;
        /* Separation from items */
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .cart-items-section {
        padding: 15px;
      }

      .cart-item {
        flex-direction: column;
        align-items: flex-start;
        position: relative;
        padding: 15px 0;
      }

      .item-image {
        width: 100%;
        height: 180px;
        margin-right: 0;
        margin-bottom: 15px;
      }

      .item-actions {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
      }

      .cart-header {
        font-size: 1rem;
      }
    }

    /* Ensure page is always scrollable */
    body,
    html {
      overflow-x: hidden;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <!-- Header injected by universal-header.js -->

  <main class="cart-container">
    <h1 class="page-title animate-fade">Your Shopping Cart</h1>

    <div class="cart-layout animate-fade">

      <!-- Cart Items List -->
      <section class="cart-items-section">
        <div class="cart-header">
          <span>Product</span>
          <span>Subtotal</span>
        </div>

        <div id="empty-cart-message" class="empty-cart-message" style="display: none;">
          <div class="empty-cart-icon">🛒</div>
          <p>Your cart is currently empty.</p>
          <a href="index.html" class="btn-primary">Start Shopping</a>
        </div>

        <div id="cart-items-list">
          <!-- Items injected by JS -->
        </div>
      </section>

      <!-- Order Summary -->
      <aside class="cart-summary-card">
        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Subtotal (<span id="summary-item-count">0</span> items)</span>
          <span id="summary-subtotal">₹0.00</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span style="color: green; font-weight: 600;">Free</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="summary-total-amount">₹0.00</span>
        </div>

        <button class="btn-primary btn-checkout" id="checkout-button" disabled>
          Proceed to Checkout
        </button>

        <div style="text-align: center; margin-top: 15px; font-size: 0.85rem; color: #888;">
          <p>🔒 Secure Checkout</p>
        </div>
      </aside>

    </div>
  </main>

  <footer class="main-footer">
    <p>© 2025 HomeMadeGifts. Contact: littlehoopsandhampers@gmail.com</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      function renderCart() {
        const cart = CartManager.getCart();
        const list = document.getElementById("cart-items-list");
        const empty = document.getElementById("empty-cart-message");
        const checkout = document.getElementById("checkout-button");
        const header = document.querySelector('.cart-header');

        if (!list || !empty || !checkout) return;

        list.innerHTML = "";
        let subtotal = 0;
        let totalItems = 0;

        if (cart.length === 0) {
          empty.style.display = "block";
          if (header) header.style.display = 'none';
          checkout.disabled = true;
          document.getElementById("summary-item-count").textContent = 0;
          document.getElementById("summary-subtotal").textContent = "₹0.00";
          document.getElementById("summary-total-amount").textContent = "₹0.00";
          return;
        }

        empty.style.display = "none";
        if (header) header.style.display = 'flex';
        checkout.disabled = false;

        cart.forEach(item => {
          const total = item.currentPrice * item.quantity;
          subtotal += total;
          totalItems += item.quantity;

          list.innerHTML += `
            <div class="cart-item">
              <img src="${item.imageSrc || "placeholder.jpg"}" alt="${item.name}" class="item-image" />
              
              <div class="item-details">
                <h4>${item.name}</h4>
                <div class="item-meta">Unit Price: ₹${item.currentPrice.toFixed(2)}</div>
                <div class="item-price">₹${total.toFixed(2)}</div>
              </div>
              
              <div class="item-actions">
                <div class="quantity-control">
                    <input type="number" min="1" max="99" value="${item.quantity}" data-id="${item.id}" onchange="handleQuantityChange(this)" aria-label="Quantity" />
                </div>
                <button class="btn-remove" data-id="${item.id}" onclick="handleRemoveItem(this)">
                    🗑️ Remove
                </button>
              </div>
            </div>`;
        });

        document.getElementById("summary-item-count").textContent = totalItems;
        document.getElementById("summary-subtotal").textContent = `₹${subtotal.toFixed(2)}`;
        document.getElementById("summary-total-amount").textContent = `₹${subtotal.toFixed(2)}`;
      }

      // Handle quantity changes from input
      window.handleQuantityChange = (input) => {
        const id = input.dataset.id;
        const qty = parseInt(input.value);
        if (qty >= 1 && qty <= 99) {
          CartManager.updateItemQuantity(id, qty);
          renderCart(); // Re-render to update totals
        } else {
          alert("Quantity must be between 1–99.");
          input.value = 1;
          CartManager.updateItemQuantity(id, 1);
          renderCart();
        }
      };

      // Handle remove item
      window.handleRemoveItem = (btn) => {
        CartManager.removeItem(btn.dataset.id);
        renderCart();
      };

      // Listen for cart updates from other tabs/scripts
      window.addEventListener('cartUpdated', (e) => {
        renderCart();
      });

      document.getElementById("checkout-button").addEventListener("click", () => {
        const loggedIn = localStorage.getItem("user_logged_in") === "true";
        if (!loggedIn) {
          alert("Please log in to continue to checkout.");
          window.location.href = "login.html";
        } else {
          // Optional: Save final total to local storage if needed by checkout page (though checkout calculates it again)
          // But let's just redirect
          window.location.href = "checkout.html";
        }
      });

      // Initial Render
      // Give a tiny delay to ensure CartManager is ready if it relies on anything async (it doesn't, but safe practice)
      setTimeout(renderCart, 50);
    });
  </script>

  <!-- Core Scripts -->
  <script src="scripts/cart-manager.js"></script>
  <script src="scripts/universal-header.js"></script>
  <script src="scripts/product-enhancements.js"></script>
  <script src="scripts/glow-reveal.js"></script>
</body>

</html>
