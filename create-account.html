<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - HomeMadeGifts</title>
  <!-- Google Fonts: Playfair Display for elegance, Montserrat for modern feel -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/premium.css">

  <style>
    :root {
      --gold: #d4af37;
      --gold-hover: #f9d970;
      --dark-bg: #121212;
      --glass-dark: rgba(20, 20, 20, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      /* Premium Dark Gradient Background */
      background: radial-gradient(circle at 80% 20%, #202020 0%, #000000 90%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ensure header sits on top */
    .main-header {
      position: relative;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8) !important;
      backdrop-filter: blur(10px);
    }

    .auth-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    /* Decorative Background Elements */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }

    .shape-1 {
      width: 300px;
      height: 300px;
      background: rgba(212, 175, 55, 0.15);
      /* Gold glow */
      bottom: 10%;
      left: 10%;
      animation: float 10s ease-in-out infinite;
    }

    .shape-2 {
      width: 250px;
      height: 250px;
      background: rgba(194, 24, 91, 0.1);
      /* Pink/Red glow */
      top: 15%;
      right: 15%;
      animation: float 12s ease-in-out infinite reverse;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(20px, -20px);
      }
    }

    /* Glass Card */
    .register-box {
      width: 100%;
      max-width: 450px;
      background: var(--glass-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      z-index: 10;
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .register-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .register-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 14px 14px 45px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      transition: color 0.3s;
    }

    .input-wrapper input:focus+.input-icon {
      color: var(--gold);
    }

    .form-hint {
      display: block;
      margin-top: 5px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: right;
    }

    /* Buttons */
    .btn-register-action {
      width: 100%;
      background: linear-gradient(135deg, #d4af37, #b48b1d);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      margin-top: 10px;
    }

    .btn-register-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      background: linear-gradient(135deg, #e6c35c, #c69d2f);
    }

    .separator {
      margin: 25px 0;
      text-align: center;
      position: relative;
    }

    .separator::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 35%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .separator::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      width: 35%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .separator span {
      background: transparent;
      padding: 0 10px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
    }

    .btn-signin {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-signin:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #fff;
    }

    .footer-text {
      text-align: center;
      margin-top: 25px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .footer-text a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      .register-box {
        padding: 30px 20px;
      }

      .register-header h2 {
        font-size: 1.8rem;
      }
    }

    /* === AUTH PAGE HEADER OVERRIDES === */
    /* Hide unnecessary header elements for a clean look */
    .header-promo-bar,
    .search-container-modern,
    .main-nav-modern,
    .user-actions {
      display: none !important;
    }

    /* Make header transparent and floating */
    .main-header {
      background: transparent !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
      border: none !important;
      position: absolute !important;
      top: 0;
      width: 100%;
      padding-top: 20px;
    }

    /* Center the Logo */
    .header-container {
      justify-content: center !important;
    }

    .header-logo-section {
      text-align: center;
      margin: 0 auto;
    }

    /* Adjust Logo Colors for Dark Theme */
    .shop-logo .logo-text {
      color: #fff !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .shop-logo .logo-main {
      color: var(--gold) !important;
    }

    .logo-tagline {
      color: rgba(255, 255, 255, 0.8) !important;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <!-- Header injected by universal-header.js -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <main class="auth-container">
    <div class="register-box">
      <div class="register-header">
        <h2>Create Account</h2>
        <p>Join our community of gift lovers</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="name" placeholder="John Doe" required>
            <span class="input-icon">👤</span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="you@example.com" required>
            <span class="input-icon">✉️</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <span class="input-icon">🔒</span>
          </div>
          <small class="form-hint">At least 6 characters</small>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirm-password" placeholder="••••••••" required>
            <span class="input-icon">🔒</span>
          </div>
        </div>

        <button type="submit" class="btn-register-action">Sign Up</button>
      </form>

      <div class="separator">
        <span>Already have an account?</span>
      </div>

      <button class="btn-signin" onclick="window.location.href='login.html'">
        Sign In
      </button>

      <div class="footer-text">
        <p>By registering, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a></p>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.querySelector('.btn-register-action');

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
      }

      // Add loading effect
      const originalText = btn.innerText;
      btn.innerText = "Creating Account...";
      btn.style.opacity = "0.7";

      setTimeout(() => {
        // Check if user exists
        const existingUser = localStorage.getItem(`user_${email}`);
        if (existingUser) {
          alert("An account with this email already exists. Please login.");
          window.location.href = "login.html";
          return;
        }

        // Register new user
        const userData = {
          id: Date.now(),
          name: name,
          email: email,
          password: password // In real app, hash this!
        };

        localStorage.setItem(`user_${email}`, JSON.stringify(userData));

        // Mark as new user for discounts
        localStorage.setItem('isNewUser', 'true');

        alert("Registration Successful! Welcome to HomeMadeGifts.");
        window.location.href = "login.html";
      }, 1000); // 1s delay for premium feel
    });
  </script>

  <!-- Core Scripts -->
  <script src="scripts/cart-manager.js"></script>
  <script src="scripts/universal-header.js"></script>
  <script src="scripts/product-enhancements.js"></script>
</body>

</html>
