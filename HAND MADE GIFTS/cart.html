<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Shopping Cart - HomeMadeGifts</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary-color: #febd69;
      --secondary-color: #232f3e;
      --background-color: #f7f7f7;
      --text-color: #1a1a1a;
      --accent-color: #007185;
      --border-color: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Roboto", sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    a {
      color: var(--accent-color);
      text-decoration: none;
    }

    /* ===== HEADER ===== */
    .main-header {
      background-color: #131921;
      color: white;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      flex-wrap: wrap;
    }

    .shop-logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary-color);
      text-decoration: none;
    }

    .user-nav {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: #f08804;
      color: white;
      border-radius: 50%;
      font-size: 0.75rem;
      padding: 2px 6px;
    }

    .main-nav {
      background-color: var(--secondary-color);
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    .main-nav a {
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .main-nav a:hover,
    .main-nav a.active {
      background-color: var(--primary-color);
      color: var(--secondary-color);
      font-weight: 600;
    }


    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .cart-content {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .cart-items {
      flex: 3;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      min-width: 300px;
    }

    .cart-summary {
      flex: 1;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      height: fit-content;
      min-width: 250px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      margin-right: 15px;
    }

    .item-details {
      flex-grow: 1;
    }

    .item-details h4 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .item-price {
      color: #b12704;
      font-weight: 600;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .item-actions input {
      width: 50px;
      text-align: center;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-size: 0.9rem;
    }

    
    .cart-summary h3 {
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      font-size: 1.2rem;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .summary-total {
      border-top: 1px solid #ccc;
      padding-top: 10px;
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-checkout {
      background-color: var(--primary-color);
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
    }

    .btn-checkout:hover {
      background-color: #f9a43a;
    }

    .btn-checkout:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .empty-cart-message {
      text-align: center;
      padding: 50px;
      color: #666;
      font-size: 1.1rem;
    }

    .main-footer {
      background-color: #222;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 0.9rem;
    }

    
    @media (max-width: 768px) {
      .cart-content {
        flex-direction: column;
      }

      .cart-summary {
        order: -1;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .main-nav a {
        font-size: 0.9rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>
  <header class="main-header">
    <div class="header-top">
      <a href="index.html" class="shop-logo">HomeMadeGifts🛍️</a>
      <nav class="user-nav">
        <a href="login.html" id="login-link">Sign In / Register</a>
        <a href="cart.html" class="cart-icon">🛒 <span id="cart-count" class="badge">0</span></a>
      </nav>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About & How to Order</a>
      <a href="contact.html">Contact Us</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="cart.html" class="active">Shopping Cart</a>
    </nav>
  </header>

  <main class="container">
    <h1>Shopping Cart</h1>

    <div class="cart-content">
      <section class="cart-items">
        <div id="cart-items-list"></div>
        <div id="empty-cart-message" class="empty-cart-message" style="display: none;">
          Your cart is empty. <a href="index.html">Start shopping now!</a>
        </div>
      </section>

      <aside class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-line">
          <span>Subtotal (<span id="summary-item-count">0</span> items)</span>
          <span id="summary-subtotal">₹0.00</span>
        </div>
        <div class="summary-line">
          <span>Shipping</span>
          <span>Free</span>
        </div>
        <div class="summary-total">
          <span>Order Total</span>
          <span id="summary-total-amount">₹0.00</span>
        </div>
        <button class="btn-checkout" id="checkout-button" disabled>Proceed to Checkout</button>
      </aside>
    </div>
  </main>

  <footer class="main-footer">
    <p>© 2025 HomeMadeGifts. Contact: littlehoopsandhampers@gmail.com</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      function getUser() {
        return JSON.parse(localStorage.getItem("user_data"));
      }

      function getCartKey() {
        const user = getUser();
        return user && (user.id || user.email)
          ? `homemade_cart_user_${user.id || user.email}`
          : "homemade_cart_guest";
      }

      function getCart() {
        const cart = localStorage.getItem(getCartKey());
        return cart ? JSON.parse(cart) : [];
      }

      function saveCart(cart) {
        localStorage.setItem(getCartKey(), JSON.stringify(cart));
        renderCart();
        updateCartCount();
      }

      function updateCartCount() {
        const total = getCart().reduce((sum, i) => sum + i.quantity, 0);
        document.getElementById("cart-count").textContent = total;
      }

      function checkLoginStatus() {
        const link = document.getElementById("login-link");
        const loggedIn = localStorage.getItem("user_logged_in") === "true";
        const user = getUser();

        if (loggedIn && user) {
          const name = user.email.split("@")[0];
          link.textContent = `Hello, ${name} (Logout)`;
          link.href = "#";
          link.addEventListener("click", e => {
            e.preventDefault();
            if (confirm("Logout?")) {
              localStorage.removeItem("user_logged_in");
              localStorage.removeItem("user_data");
              localStorage.removeItem(getCartKey());
              window.location.href = "login.html";
            }
          });
        } else {
          link.textContent = "Sign In / Register";
          link.href = "login.html";
        }
      }

     
      function updateItemQuantity(id, quantity) {
        let cart = getCart();
        const index = cart.findIndex(i => i.id === id);
        if (index > -1) {
          if (quantity > 0) cart[index].quantity = quantity;
          else cart.splice(index, 1);
          saveCart(cart);
        }
      }

      function removeItem(id) {
        if (confirm("Remove this item?")) updateItemQuantity(id, 0);
      }

      window.handleQuantityChange = input => {
        const id = input.dataset.id;
        const qty = parseInt(input.value);
        if (qty >= 1 && qty <= 99) updateItemQuantity(id, qty);
        else alert("Quantity must be between 1–99.");
      };

      window.handleRemoveItem = btn => removeItem(btn.dataset.id);

      function renderCart() {
        const cart = getCart();
        const list = document.getElementById("cart-items-list");
        const empty = document.getElementById("empty-cart-message");
        const checkout = document.getElementById("checkout-button");

        list.innerHTML = "";
        let subtotal = 0;
        let totalItems = 0;

        if (cart.length === 0) {
          empty.style.display = "block";
          checkout.disabled = true;
          document.getElementById("summary-item-count").textContent = 0;
          document.getElementById("summary-subtotal").textContent = "₹0.00";
          document.getElementById("summary-total-amount").textContent = "₹0.00";
          return;
        }

        empty.style.display = "none";
        checkout.disabled = false;

        cart.forEach(item => {
          const total = item.currentPrice * item.quantity;
          subtotal += total;
          totalItems += item.quantity;

          list.innerHTML += `
            <div class="cart-item">
              <img src="${item.imageSrc || "placeholder.jpg"}" alt="${item.name}" class="item-image" />
              <div class="item-details">
                <h4>${item.name}</h4>
                <p class="item-price">₹${item.currentPrice.toFixed(2)} × ${item.quantity}</p>
              </div>
              <div class="item-actions">
                <input type="number" min="1" max="99" value="${item.quantity}" data-id="${item.id}" onchange="handleQuantityChange(this)" />
                <button class="btn-remove" data-id="${item.id}" onclick="handleRemoveItem(this)">Remove</button>
              </div>
            </div>`;
        });

        document.getElementById("summary-item-count").textContent = totalItems;
        document.getElementById("summary-subtotal").textContent = `₹${subtotal.toFixed(2)}`;
        document.getElementById("summary-total-amount").textContent = `₹${subtotal.toFixed(2)}`;
      }


      document.getElementById("checkout-button").addEventListener("click", () => {
        const loggedIn = localStorage.getItem("user_logged_in") === "true";
        if (!loggedIn) {
          alert("Please log in to continue to checkout.");
          window.location.href = "login.html";
        } else {
          window.location.href = "checkout.html";
        }
      });


      checkLoginStatus();
      updateCartCount();
      renderCart();
    });
  </script>
</body>
</html>
